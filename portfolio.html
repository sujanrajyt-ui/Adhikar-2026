<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | ADHIKAR'26</title>
    <link rel="icon" type="image/x-icon" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--maroon-900); color: var(--cream-300); }
        .pf-page { padding: 2rem 1rem; max-width: 800px; margin: 0 auto; }
        .pf-page h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #fff; margin-bottom: 0.25rem; }
        .pf-page .subtitle { color: rgba(255,255,255,0.35); font-size: 0.85rem; margin-bottom: 2rem; }

        .pf-party { margin-bottom: 2rem; }
        .pf-party-header {
            font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700;
            padding: 0.6rem 1rem; border-radius: 10px 10px 0 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .pf-party-header .pf-count { font-size: 0.7rem; font-weight: 400; opacity: 0.6; }

        .pf-party-a .pf-party-header { background: rgba(52,152,219,0.12); color: #5dade2; border-bottom: 2px solid rgba(52,152,219,0.2); }
        .pf-party-b .pf-party-header { background: rgba(46,204,113,0.12); color: #2ecc71; border-bottom: 2px solid rgba(46,204,113,0.2); }
        .pf-party-c .pf-party-header { background: rgba(155,89,182,0.12); color: #bb8fce; border-bottom: 2px solid rgba(155,89,182,0.2); }
        .pf-party-d .pf-party-header { background: rgba(230,126,34,0.12); color: #e67e22; border-bottom: 2px solid rgba(230,126,34,0.2); }
        .pf-party-e .pf-party-header { background: rgba(231,76,60,0.12); color: #e74c3c; border-bottom: 2px solid rgba(231,76,60,0.2); }

        .pf-member { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; padding: 0.6rem 1rem; background: var(--maroon-800); border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.82rem; align-items: center; }
        .pf-member:last-child { border-radius: 0 0 10px 10px; }
        .pf-member .name { font-weight: 600; color: #fff; }
        .pf-member .constituency { color: var(--gold-400); font-weight: 500; }
        .pf-member .committee { color: rgba(255,255,255,0.5); }
        .pf-member.header { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.2); font-weight: 600; padding-top: 0.5rem; padding-bottom: 0.5rem; background: rgba(255,255,255,0.02); }

        .pf-none { text-align: center; padding: 3rem; color: rgba(255,255,255,0.2); }
        .pf-loading { text-align: center; padding: 3rem; color: rgba(255,255,255,0.2); }
        .pf-error { text-align: center; padding: 3rem; color: #e74c3c; }
        .back-link { display: inline-block; margin-top: 2rem; font-size: 0.8rem; color: var(--gold-500); text-decoration: none; }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .pf-member { grid-template-columns: 1fr; gap: 0.15rem; }
            .pf-member.header { display: none; }
            .pf-member .constituency:before { content: "Constituency: "; font-size: 0.6rem; color: rgba(255,255,255,0.2); display: block; }
            .pf-member .committee:before { content: "Committee: "; font-size: 0.6rem; color: rgba(255,255,255,0.2); display: block; }
        }
    </style>
</head>
<body>
    <div class="pf-page">
        <h1>Portfolio</h1>
        <p class="subtitle">Party-wise list of members with their constituencies and committees</p>

        <div id="pf-content"></div>

        <div id="pf-timestamp" style="text-align:center;font-size:0.65rem;color:rgba(255,255,255,0.15);margin-top:1rem;"></div>

        <a href="/" class="back-link">&larr; Back to Home</a>
    </div>

    <script>
        const API_BASE = '/api';

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function partyClass(party) {
            if (!party) return '';
            const match = party.match(/\((\w)\)$/);
            const suffix = match ? match[1].toLowerCase() : party.toLowerCase().replace(/\s+/g, '-');
            return 'pf-party-' + suffix;
        }

        let refreshInterval = null;

        async function load() {
            const container = document.getElementById('pf-content');
            const ts = document.getElementById('pf-timestamp');

            try {
                const [delegatesRes, partiesRes] = await Promise.all([
                    fetch(`${API_BASE}/delegates?t=${Date.now()}`),
                    fetch(`${API_BASE}/parties?t=${Date.now()}`)
                ]);

                if (!delegatesRes.ok) throw new Error('Failed to load');

                const delegates = await delegatesRes.json();
                const partyItems = partiesRes.ok ? await partiesRes.json() : [];
                const partyNames = partyItems.filter(p => p.type === 'party').map(p => p.name);

                const withAssignment = delegates.filter(d => d.assigned_party);

                if (!withAssignment.length) {
                    container.innerHTML = '<div class="pf-none">No delegates have been assigned yet.</div>';
                    return;
                }

                // Group by party, preserving party order
                const byParty = {};
                withAssignment.forEach(d => {
                    if (!byParty[d.assigned_party]) byParty[d.assigned_party] = [];
                    byParty[d.assigned_party].push(d);
                });

                const partyOrder = partyNames.length
                    ? partyNames
                    : ['Rashtriya Yuva Pragati Manch (A)', 'Yuva Drishti Party (B)', 'Next Gen Leaders (C)', 'Catalyst Party (D)', 'Navpeedhi Bharat Party (E)'];
                const sortedKeys = Object.keys(byParty).sort((a, b) => {
                    const ai = partyOrder.indexOf(a);
                    const bi = partyOrder.indexOf(b);
                    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
                });

                let html = '';
                sortedKeys.forEach(key => {
                    const members = byParty[key];
                    html += `<div class="pf-party ${partyClass(key)}">
                        <div class="pf-party-header">
                            <span>${escapeHtml(key)}</span>
                            <span class="pf-count">${members.length} member${members.length > 1 ? 's' : ''}</span>
                        </div>
                        <div class="pf-member header">
                            <span>Member</span>
                            <span>Constituency</span>
                            <span>Committee</span>
                        </div>
                        ${members.map(m => `
                            <div class="pf-member">
                                <span class="name">${escapeHtml(m.name)}</span>
                                <span class="constituency">${m.assigned_constituency ? escapeHtml(m.assigned_constituency) : '<span style="opacity:0.3">—</span>'}</span>
                                <span class="committee">${m.assigned_committee ? escapeHtml(m.assigned_committee) : '<span style="opacity:0.3">—</span>'}</span>
                            </div>
                        `).join('')}
                    </div>`;
                });

                container.innerHTML = html;
                ts.textContent = 'Last updated: ' + new Date().toLocaleTimeString();
            } catch (e) {
                container.innerHTML = '<div class="pf-error">Failed to load data. Make sure you are connected to the server.</div>';
                ts.textContent = '';
            }
        }

        load();
        refreshInterval = setInterval(load, 15000);
    </script>
</body>
</html>
