<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parties, Portfolios & Constituencies | ADHIKAR'26</title>
    <link rel="icon" type="image/x-icon" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--maroon-900); color: var(--cream-300); }
        .portfolio-page { padding: 2rem 1rem; max-width: 900px; margin: 0 auto; }
        .portfolio-page h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #fff; margin-bottom: 0.25rem; }
        .portfolio-page .subtitle { color: rgba(255,255,255,0.35); font-size: 0.85rem; margin-bottom: 2rem; }
        .portfolio-section { margin-bottom: 2rem; }
        .portfolio-section h2 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--gold-500); margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .portfolio-grid { display: grid; gap: 0.75rem; }
        .portfolio-card { background: var(--maroon-800); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 1rem 1.25rem; transition: border-color 0.2s; }
        .portfolio-card:hover { border-color: rgba(212,175,55,0.2); }
        .portfolio-card .card-name { font-weight: 700; font-size: 0.95rem; color: #fff; }
        .portfolio-card .card-side { display: inline-block; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 4px; margin-left: 0.5rem; vertical-align: middle; }
        .card-side-ruling { background: rgba(46,204,113,0.12); color: #2ecc71; border: 1px solid rgba(46,204,113,0.15); }
        .card-side-opposition { background: rgba(231,76,60,0.12); color: #e74c3c; border: 1px solid rgba(231,76,60,0.15); }
        .portfolio-card .card-desc { font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-top: 4px; }
        .portfolio-loading { text-align: center; padding: 3rem; color: rgba(255,255,255,0.2); }
        .portfolio-error { text-align: center; padding: 3rem; color: #e74c3c; }
        .back-link { display: inline-block; margin-top: 2rem; font-size: 0.8rem; color: var(--gold-500); text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="portfolio-page">
        <h1>Parties &amp; Portfolios</h1>
        <p class="subtitle">ADHIKAR'26 Mock Parliament &mdash; Political parties, ministerial portfolios and constituencies</p>

        <div id="parties-section" class="portfolio-section">
            <h2>Political Parties</h2>
            <div id="parties-list" class="portfolio-grid"></div>
        </div>

        <div id="committees-section" class="portfolio-section">
            <h2>Ministerial Portfolios</h2>
            <div id="committees-list" class="portfolio-grid"></div>
        </div>

        <div id="constituencies-section" class="portfolio-section">
            <h2>Constituencies by Party</h2>
            <div id="constituencies-list"></div>
        </div>

        <a href="/" class="back-link">&larr; Back to Home</a>
    </div>

    <script>
        const API_BASE = '/api';

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function partyColor(party) {
            const colors = {
                'Party A': { bg: 'rgba(52,152,219,0.12)', border: 'rgba(52,152,219,0.2)', text: '#5dade2' },
                'Party B': { bg: 'rgba(46,204,113,0.12)', border: 'rgba(46,204,113,0.2)', text: '#2ecc71' },
                'Party C': { bg: 'rgba(155,89,182,0.12)', border: 'rgba(155,89,182,0.2)', text: '#bb8fce' },
                'Party D': { bg: 'rgba(230,126,34,0.12)', border: 'rgba(230,126,34,0.2)', text: '#e67e22' },
                'Party E': { bg: 'rgba(231,76,60,0.12)', border: 'rgba(231,76,60,0.2)', text: '#e74c3c' },
            };
            return colors[party] || { bg: 'rgba(255,255,255,0.04)', border: 'rgba(255,255,255,0.08)', text: 'rgba(255,255,255,0.4)' };
        }

        function constituencyPill(name, party) {
            const c = partyColor(party);
            return `<span style="display:inline-flex;align-items:center;gap:6px;background:${c.bg};border:1px solid ${c.border};border-radius:6px;padding:4px 12px;font-size:0.78rem;transition:border-color 0.15s;" onmouseover="this.style.borderColor='rgba(212,175,55,0.3)'" onmouseout="this.style.borderColor='${c.border}'">
                <span style="color:var(--cream-300);">${escapeHtml(name)}</span>
                ${party ? `<span style="font-size:0.6rem;font-weight:600;color:${c.text};">${escapeHtml(party)}</span>` : ''}
            </span>`;
        }

        async function load() {
            const partiesList = document.getElementById('parties-list');
            const committeesList = document.getElementById('committees-list');
            const constituenciesList = document.getElementById('constituencies-list');

            try {
                const [partiesRes, delegatesRes, constituenciesRes] = await Promise.all([
                    fetch(`${API_BASE}/parties?t=${Date.now()}`),
                    fetch(`${API_BASE}/delegates?t=${Date.now()}`),
                    fetch(`${API_BASE}/constituencies?t=${Date.now()}`)
                ]);

                if (!partiesRes.ok) throw new Error('Failed to load');

                const items = await partiesRes.json();
                const parties = items.filter(p => p.type === 'party');
                const committees = items.filter(p => p.type === 'committee');

                if (parties.length) {
                    partiesList.innerHTML = parties.map(p => {
                        const side = p.side === 'ruling' ? 'Ruling' : p.side === 'opposition' ? 'Opposition' : '';
                        const sideBadge = side ? `<span class="card-side card-side-${p.side}">${side}</span>` : '';
                        return `<div class="portfolio-card">
                            <div class="card-name">${escapeHtml(p.name)}${sideBadge}</div>
                            ${p.description ? `<div class="card-desc">${escapeHtml(p.description)}</div>` : ''}
                        </div>`;
                    }).join('');
                } else {
                    partiesList.innerHTML = '<div class="portfolio-loading">No parties configured yet.</div>';
                }

                if (committees.length) {
                    committeesList.innerHTML = committees.map(c =>
                        `<div class="portfolio-card">
                            <div class="card-name">${escapeHtml(c.name)}</div>
                            ${c.description ? `<div class="card-desc">${escapeHtml(c.description)}</div>` : ''}
                        </div>`
                    ).join('');
                } else {
                    committeesList.innerHTML = '<div class="portfolio-loading">No portfolios configured yet.</div>';
                }

                // Build constituency → party map from delegate assignments
                const consParty = {};
                if (delegatesRes.ok) {
                    const delegateList = await delegatesRes.json();
                    delegateList.forEach(d => {
                        if (d.assigned_constituency && d.assigned_party) {
                            consParty[d.assigned_constituency] = d.assigned_party;
                        }
                    });
                }

                // Group all constituencies by party
                const allConstituencies = constituenciesRes.ok ? await constituenciesRes.json() : [];
                const byParty = {};
                const unassigned = [];
                allConstituencies.sort().forEach(c => {
                    const party = consParty[c];
                    if (party) {
                        if (!byParty[party]) byParty[party] = [];
                        byParty[party].push(c);
                    } else {
                        unassigned.push(c);
                    }
                });

                const partyOrder = parties.map(p => p.name);
                const sortedKeys = Object.keys(byParty).sort((a, b) => {
                    const ai = partyOrder.indexOf(a);
                    const bi = partyOrder.indexOf(b);
                    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
                });

                let html = '';
                sortedKeys.forEach(key => {
                    html += `<div class="portfolio-section" style="margin-bottom:1rem;">
                        <h3 style="font-family:'Playfair Display',serif;font-size:0.95rem;color:var(--cream-100);margin-bottom:0.5rem;">${escapeHtml(key)} <span style="font-weight:400;font-size:0.7rem;color:rgba(255,255,255,0.25);">(${byParty[key].length})</span></h3>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;">${byParty[key].map(c => constituencyPill(c, key)).join('')}</div>
                    </div>`;
                });
                if (unassigned.length) {
                    html += `<div class="portfolio-section" style="margin-bottom:1rem;">
                        <h3 style="font-family:'Playfair Display',serif;font-size:0.95rem;color:rgba(255,255,255,0.3);margin-bottom:0.5rem;">Unassigned <span style="font-weight:400;font-size:0.7rem;color:rgba(255,255,255,0.2);">(${unassigned.length})</span></h3>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;">${unassigned.map(c => constituencyPill(c, null)).join('')}</div>
                    </div>`;
                }

                constituenciesList.innerHTML = html || '<div class="portfolio-loading">No constituencies found.</div>';
            } catch (e) {
                partiesList.innerHTML = '<div class="portfolio-error">Failed to load data. Make sure you are connected to the server.</div>';
                committeesList.innerHTML = '';
                constituenciesList.innerHTML = '';
            }
        }

        load();
    </script>
</body>
</html>
