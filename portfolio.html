<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | ADHIKAR'26</title>
    <link rel="icon" type="image/x-icon" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--maroon-900); color: var(--cream-300); }
        .pf-page { padding: 2rem 1rem; max-width: 700px; margin: 0 auto; }
        .pf-page h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #fff; margin-bottom: 0.25rem; }
        .pf-page .subtitle { color: rgba(255,255,255,0.35); font-size: 0.85rem; margin-bottom: 2rem; }
        .pf-search { margin-bottom: 2rem; }
        .pf-search input { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: var(--maroon-800); color: var(--cream-300); font-size: 0.95rem; font-family: inherit; outline: none; box-sizing: border-box; transition: border-color 0.2s; }
        .pf-search input:focus { border-color: var(--gold-500); }
        .pf-search input::placeholder { color: rgba(255,255,255,0.2); }
        .pf-result { background: var(--maroon-800); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 1.5rem; margin-bottom: 1rem; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .pf-result h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: #fff; margin: 0 0 0.25rem; }
        .pf-result .pf-id { font-size: 0.7rem; color: rgba(255,255,255,0.25); margin-bottom: 1rem; }
        .pf-row { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .pf-row:last-child { border-bottom: none; }
        .pf-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: rgba(255,255,255,0.3); }
        .pf-value { font-size: 0.9rem; font-weight: 600; color: #fff; text-align: right; }
        .pf-value.party-a { color: #5dade2; }
        .pf-value.party-b { color: #2ecc71; }
        .pf-value.party-c { color: #bb8fce; }
        .pf-value.party-d { color: #e67e22; }
        .pf-value.party-e { color: #e74c3c; }
        .pf-none { text-align: center; padding: 3rem; color: rgba(255,255,255,0.2); font-size: 0.9rem; }
        .pf-loading { text-align: center; padding: 3rem; color: rgba(255,255,255,0.2); }
        .pf-error { text-align: center; padding: 3rem; color: #e74c3c; }
        .back-link { display: inline-block; margin-top: 2rem; font-size: 0.8rem; color: var(--gold-500); text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="pf-page">
        <h1>My Portfolio</h1>
        <p class="subtitle">Search your name to see your constituency, party &amp; committee</p>

        <div class="pf-search">
            <input type="text" id="pf-search-input" placeholder="Search your name..." autocomplete="off">
        </div>

        <div id="pf-results"></div>

        <a href="/" class="back-link">&larr; Back to Home</a>
    </div>

    <script>
        const API_BASE = '/api';
        let delegates = [];
        let searchTimeout = null;

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function partyClass(party) {
            if (!party) return '';
            return 'party-' + party.toLowerCase().replace(/\s+/g, '-');
        }

        function renderResult(d) {
            const colourClass = partyClass(d.assigned_party);
            return `<div class="pf-result">
                <h2>${escapeHtml(d.name)}</h2>
                <div class="pf-id">ID: ${escapeHtml(d.id)}</div>
                <div class="pf-row">
                    <span class="pf-label">Constituency</span>
                    <span class="pf-value">${d.assigned_constituency ? escapeHtml(d.assigned_constituency) : '<span style="color:rgba(255,255,255,0.2);font-weight:400;">Not assigned</span>'}</span>
                </div>
                <div class="pf-row">
                    <span class="pf-label">Party</span>
                    <span class="pf-value ${colourClass}">${d.assigned_party ? escapeHtml(d.assigned_party) : '<span style="color:rgba(255,255,255,0.2);font-weight:400;">Not assigned</span>'}</span>
                </div>
                <div class="pf-row">
                    <span class="pf-label">Committee / Portfolio</span>
                    <span class="pf-value">${d.assigned_committee ? escapeHtml(d.assigned_committee) : '<span style="color:rgba(255,255,255,0.2);font-weight:400;">Not assigned</span>'}</span>
                </div>
            </div>`;
        }

        function doSearch(query) {
            const container = document.getElementById('pf-results');
            const q = query.trim().toLowerCase();
            if (!q) {
                container.innerHTML = '<div class="pf-none">Type your name above to find your portfolio.</div>';
                return;
            }
            const matches = delegates.filter(d =>
                d.name.toLowerCase().includes(q) || d.id.toLowerCase().includes(q)
            );
            if (!matches.length) {
                container.innerHTML = '<div class="pf-none">No delegate found matching "' + escapeHtml(q) + '".</div>';
                return;
            }
            container.innerHTML = matches.map(renderResult).join('');
        }

        async function load() {
            const container = document.getElementById('pf-results');
            container.innerHTML = '<div class="pf-loading">Loading...</div>';
            try {
                const res = await fetch(`${API_BASE}/delegates?t=${Date.now()}`);
                if (!res.ok) throw new Error('Failed to load');
                delegates = await res.json();
                container.innerHTML = '<div class="pf-none">Type your name above to find your portfolio.</div>';

                document.getElementById('pf-search-input').addEventListener('input', function() {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => doSearch(this.value), 150);
                });
            } catch (e) {
                container.innerHTML = '<div class="pf-error">Failed to load delegate data. Make sure you are connected to the server.</div>';
            }
        }

        load();
    </script>
</body>
</html>
