<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | ADHIKAR'26</title>
    <link rel="icon" type="image/x-icon" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="leaderboard.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Loading Screen -->
    <div id="page-loader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <header class="scores-header">
        <div class="container header-inner">
            <div class="brand">
                <span>ADHIKAR<span class="gold-text">'26</span> <span class="tabbing-badge">LEADERBOARD</span></span>
            </div>
            <a href="/" class="btn-ghost">Back to Home</a>
        </div>
    </header>

    <main class="container leaderboard-container">
        <header class="leaderboard-hero reveal">
            <span class="eyebrow eyebrow-gold">Parliamentary Standings</span>
            <h1 class="h1 shimmer-text">Leaderboard</h1>
            <p class="hero-sub">Real-time performance rankings based on official parliamentary metrics.</p>

            <div class="leaderboard-controls glass-panel">
                <div class="filter-group">
                    <label for="award-selector">View Rankings for:</label>
                    <select id="award-selector" class="award-select"></select>
                </div>
                <div id="award-info-box" class="award-info-box"></div>
                <div id="update-time" class="update-time text-center">Last updated: Loading...</div>
            </div>
        </header>

        <!-- Podium (Top 3) -->
        <section id="podium-section" class="podium-section reveal-stagger"></section>

        <!-- Detailed Rankings -->
        <section class="rankings-table-wrap glass-panel reveal">
            <h3 class="table-title">Full Standings</h3>
            <div class="table-responsive">
                <table class="rankings-table">
                    <thead>
                        <tr>
                            <th class="col-rank">Rank</th>
                            <th class="col-delegate">Delegate</th>
                            <th class="col-info">Committee & Side</th>
                            <th class="col-score text-right">Points</th>
                        </tr>
                    </thead>
                    <tbody id="rankings-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Adhikar Mock Parliament. All rights reserved.</p>
        </div>
    </footer>

    <script src="leaderboard.js?v=20260606_2"></script>
</body>

</html>
