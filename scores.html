<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoring Dashboard | ADHIKAR'26</title>
    <link rel="icon" type="image/x-icon" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="scores.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="page-loader" class="page-loader">
        <div class="loader-logo">
            <img src="assets/logo.png" alt="Adhikar">
        </div>
    </div>

    <header class="scores-header">
        <div class="container header-inner">
            <div class="brand">
                <img src="assets/logo.png" alt="Adhikar">
                <span>ADHIKAR<span class="gold-text">'26</span> <span class="tabbing-badge">TABBING</span></span>
            </div>
            <div id="judge-info" class="judge-info hidden">
                <span id="judge-display-id" class="judge-id-pill"></span>
                <button id="scores-logout" class="btn-ghost">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Login Section -->
        <section id="login-section" class="login-card reveal">
            <div class="login-head">
                <p class="kicker kicker-gold">Judge Authentication</p>
                <h2>Secure Scoring Entry</h2>
                <p class="login-sub">Please enter your assigned Judge ID and Passcode to continue.</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="field">
                    <label for="judge-id">Judge ID</label>
                    <input type="text" id="login-judge-id" placeholder="e.g. J-101" required>
                </div>
                <div class="field">
                    <label for="judge-pass">Passcode</label>
                    <input type="password" id="login-judge-pass" placeholder="••••••" required>
                </div>
                <div id="login-err" class="form-err"></div>
                <button type="submit" class="btn-primary">
                    Authenticate
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                </button>
            </form>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="dashboard-wrap hidden">
            <div class="dashboard-head">
                <div class="head-left">
                    <p class="kicker kicker-gold">Tabbing Dashboard</p>
                    <h1>Delegate Evaluation</h1>
                </div>
                <div class="head-right">
                    <div class="search-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input type="text" id="delegate-search" placeholder="Search by name, party, or committee...">
                    </div>
                </div>
            </div>

            <div class="dashboard-grid">
                <aside class="sidebar">
                    <div class="criteria-card">
                        <h3>Scoring Criteria</h3>
                        <p class="muted">Active evaluation metrics</p>
                        <div id="criteria-list" class="criteria-list">
                            <!-- Dynamically populated -->
                        </div>
                    </div>
                    <div class="stats-card">
                        <h3>Progress</h3>
                        <div class="progress-info">
                            <span id="scored-count">0</span> / <span id="total-count">0</span> Evaluated
                        </div>
                        <div class="progress-bar-bg">
                            <div id="progress-fill" class="progress-bar-fill" style="width: 0%"></div>
                        </div>
                    </div>
                </aside>

                <div class="main-content">
                    <div id="delegate-list" class="delegate-list">
                        <!-- Dynamically populated -->
                        <div class="loader-placeholder">Loading delegates...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Scoring Modal -->
    <div id="scoring-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modal-close">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
            <div class="modal-inner">
                <div class="modal-header">
                    <p class="kicker kicker-gold">Evaluate Delegate</p>
                    <h2 id="modal-delegate-name"></h2>
                    <div class="delegate-meta">
                        <span id="modal-delegate-party" class="meta-pill"></span>
                        <span id="modal-delegate-committee" class="meta-pill"></span>
                    </div>
                </div>
                <form id="scoring-form" class="scoring-form">
                    <div id="criteria-inputs" class="criteria-inputs">
                        <!-- Dynamically populated -->
                    </div>
                    <div class="modal-actions">
                        <button type="submit" class="btn-primary">Save Scores</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="scores.js"></script>
</body>

</html>
